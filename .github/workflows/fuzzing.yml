name: Fuzzing skeleton
on:
  schedule:
    - cron: '0 3 * * *'
  push:
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: python -m pip install -r services/api/requirements.txt
      - name: Run placeholder fuzz
        run: python scripts/fuzz_placeholder.py
