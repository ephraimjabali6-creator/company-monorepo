name: Orchestrate & Validate Contracts
on:
  push:
    branches: [ main ]
jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: python -m pip install -r services/api/requirements.txt
      - name: Run orchestrator
        run: python scripts/orchestrate_contracts.py
