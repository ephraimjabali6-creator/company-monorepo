version: '3.8'
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  backend:
    build: ./services/api
    env_file: .env
    depends_on:
      - redis
    ports:
      - "8000:8000"
  frontend:
    build: ./apps/dashboard
    ports:
      - "3000:3000"
